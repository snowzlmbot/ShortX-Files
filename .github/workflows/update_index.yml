name: Update index

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: temurin

    - name: Grant execute permission for gradlew
      run: chmod +x tools/AutoGen/gradlew

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        arguments: run -PGPR_USER="${{ secrets.GPR_USER }}" -PGPR_API_KEY="${{ secrets.GPR_API_KEY }}" --args="../../"
        build-root-directory: tools/AutoGen

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v7
      with:
        token: "${{ secrets.PAT }}"
        commit-message: "Update index"
        committer: "GitHub <noreply@github.com>"
        author: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        signoff: false
        delete-branch: true
        title: "[Index] Update index"
        body: |
          Update index
          - Updated with latest files
        assignees: tornaco
        reviewers: tornaco
        draft: false
